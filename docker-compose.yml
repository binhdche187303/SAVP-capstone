# =============================================================================
# CAPSTONE Backend — Full Stack (Backend + Infra) via Docker
# Usage: docker compose up --build -d
#        docker compose logs -f backend
# Infra-only (như cũ): docker compose -f docker-compose.dev.yml up -d
# =============================================================================

services:
  # ─── Backend (NestJS) ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-backend
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file:
      - .env
    environment:
      # Ghi đè host để backend trong container nói chuyện với service khác
      # qua Docker network (không phải localhost của host).
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_REDIS_HOST: redis
      BULL_REDIS_PORT: 6379
      # MinIO: backend dùng service name, console vẫn expose ra host
      STORAGE_S3_ENDPOINT: minio
      STORAGE_S3_PORT: 9000
      IVSS_BRIDGE_BASE_URL: ${IVSS_BRIDGE_BASE_URL:-}
    volumes:
      - backend-storage:/app/storage
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${APP_PORT:-3000}/api/v1/health 2>/dev/null || curl -f http://localhost:$${APP_PORT:-3000}/api/v1 2>/dev/null || curl -f http://localhost:$${APP_PORT:-3000}/ 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MinIO (S3-compatible) ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: capstone-minio
    ports:
      - "9000:9000"   # API
      - "9002:9002"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9002"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -f http://localhost:9000/minio/health/live 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: ${DB_DATABASE:-capstone_db}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-capstone_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
  pg-data:
  backend-storage:
  backend-uploads:
